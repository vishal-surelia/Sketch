<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Etch-a-Sketch</h1>

    <div class="container">

        <div class="gridChange">
            <button class="change">change/reset</button>
            <input type="number" min="0" value="16" placeholder="Grid" class="numb">
        </div>

        <div class="option">
            <input type="color" id="colorSelect">
            <button class="paint">Paint</button>
            <button class = "random">RGB</button>
            <button class="erase">Erase</button>
        </div>

    </div>

    <div id="grid"></div>


</body>
</html>
